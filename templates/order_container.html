{% load gettotal %}
{% load getstatus %}
<div class="small-container cart-page">
    
        {% if orders %}

        <table>
            <tbody><tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Total Price</th>
                <th>Status</th> 
            </tr>
            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>{{ order.create_at }}</td>
                <td>{% gettotal order %}</td>
                <td>{% getstatus order.Order_status %}</td>
            </tr>
            {% endfor %}

        </tbody></table>
        {% else %}
        <p>NO Orders</p>
    {% endif %}
    </div>
