
{% load static %}

    <!-- Featured Products -->

    <div class="small-container">
        <h2 class="title">Featured Products</h2>
        <div class="row">
            {% for product in featured_products %}
          <div class="col-4">
                <a href="{% url 'detail_product' product.id  %}"> <img src="{{ product.image.url }}"> </a>
                <h4>{{ product.title }}</h4>
                <div class="rating">
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star-o"></i>
                </div>
                <p>${{ product.price }}</p>
            </div>
            {% endfor %}
        <h2 class="title">Latest Products</h2>
        <div class="row">
            {% for product in latest_products %}
          <div class="col-4">
                <a href="{% url 'detail_product' product.id  %}"> <img src="{{ product.image.url }}"> </a>
                <h4>{{ product.title }}</h4>
                <div class="rating">
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star"></i>
                    <i class="fa fa-star-o"></i>
                </div>
                <p>${{ product.price }}</p>
            </div>
            {% endfor %}
    <div class="brands">
        <div class="small-container">
            <div class="row">
                <div class="col-5">
                    <img src="{% static 'images/logo-godrej.png' %}">
                </div>
                <div class="col-5">
                    <img src="{% static 'images/logo-oppo.png' %}">
                </div>
                <div class="col-5">
                    <img src="{% static 'images/logo-coca-cola.png' %}">
                </div>
                <div class="col-5">
                    <img src="{% static 'images/logo-paypal.png' %}">
                </div>
                <div class="col-5">
                    <img src="{% static 'images/logo-philips.png' %}">
                </div>
            </div>
        </div>
    </div>
